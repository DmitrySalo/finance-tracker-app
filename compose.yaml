services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finance_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-finance_tracker_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fictional-postgres-password}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-finance_tracker}
      DATASOURCE_USERNAME: ${POSTGRES_USER:-finance_tracker_app}
      DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-fictional-postgres-password}
      JWT_ISSUER: ${JWT_ISSUER:-finance-tracker}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-finance-tracker-web}
      JWT_SECRET: ${JWT_SECRET:-fictional-development-jwt-secret-change-before-deployment}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-15m}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      MAX_REQUEST_SIZE: ${MAX_REQUEST_SIZE:-2MB}
      MAX_CSV_FILE_SIZE: ${MAX_CSV_FILE_SIZE:-1MB}
      MAX_CSV_ROWS: ${MAX_CSV_ROWS:-10000}
      MAX_REQUEST_HEADER_SIZE: ${MAX_REQUEST_HEADER_SIZE:-16KB}
      REGISTRATION_MAX_ATTEMPTS: ${REGISTRATION_MAX_ATTEMPTS:-5}
      REGISTRATION_WINDOW: ${REGISTRATION_WINDOW:-1m}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - application
      - database
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - application
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  application:
  database:
    internal: true
