spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
  flyway:
    locations: classpath:db/migration,classpath:db/demo-migration

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
