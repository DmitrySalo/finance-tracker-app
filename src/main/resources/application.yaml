spring:
  application:
    name: finance-tracker-app
  jackson:
    time-zone: UTC
    write:
      write-bigdecimal-as-plain: true

app:
  time-zone: UTC
  jwt:
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE}
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  limits:
    max-request-size: ${MAX_REQUEST_SIZE}
    max-csv-file-size: ${MAX_CSV_FILE_SIZE}
    max-csv-rows: ${MAX_CSV_ROWS}

server:
  tomcat:
    max-http-form-post-size: ${app.limits.max-request-size}
  max-http-request-header-size: ${MAX_REQUEST_HEADER_SIZE}

spring.servlet.multipart:
  max-file-size: ${app.limits.max-csv-file-size}
  max-request-size: ${app.limits.max-request-size}
